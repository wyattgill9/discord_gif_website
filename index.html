<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gif it</title>
    <meta name="description" content="Turn an image or video into a GIF, in your browser." />
    <style>
      :root {
        --bg: #1a1b1e;
        --panel: #232428;
        --line: #34363c;
        --text: #e8e9ea;
        --dim: #9a9ba0;
        --accent: #5865f2;
        --ok: #3ba55d;
        --warn: #faa61a;
        --bad: #ed4245;
      }
      * { box-sizing: border-box; }
      /* Author display rules outrank the UA's [hidden] rule, so say it louder. */
      [hidden] { display: none !important; }
      body {
        margin: 0 auto;
        padding: 2.5rem 1.25rem 4rem;
        max-width: 40rem;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      h1 { margin: 0; font-size: 1.5rem; }
      .sub { margin: 0.25rem 0 1.5rem; color: var(--dim); font-size: 0.875rem; }

      #drop {
        display: grid;
        place-content: center;
        gap: 0.25rem;
        min-height: 9rem;
        padding: 1.5rem;
        border: 2px dashed var(--line);
        border-radius: 0.75rem;
        background: var(--panel);
        text-align: center;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
      }
      #drop:hover, #drop.over { border-color: var(--accent); background: #26272c; }
      #drop small { color: var(--dim); }
      #file { display: none; }

      fieldset { margin: 1.25rem 0 0; padding: 0; border: 0; }
      .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
      .chip, button {
        padding: 0.4rem 0.75rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        color: var(--text);
        font: inherit;
        font-size: 0.875rem;
        cursor: pointer;
      }
      .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); }
      .chip small { display: block; font-size: 0.7rem; opacity: 0.75; }

      .row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin-top: 0.875rem; }
      label { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.875rem; color: var(--dim); }
      input[type="number"] {
        width: 5rem;
        padding: 0.35rem 0.5rem;
        border: 1px solid var(--line);
        border-radius: 0.375rem;
        background: var(--bg);
        color: var(--text);
        font: inherit;
      }
      #crop { margin-top: 1.25rem; }
      #crop .sub { margin: 0.5rem 0 0; }
      /* Hugs the canvas so #sel's percentages line up with the image, and clips the
         9999px shadow below to the image instead of blacking out the page. */
      #stage { position: relative; width: max-content; max-width: 100%; overflow: hidden; border-radius: 0.75rem; }
      #src { display: block; max-width: 100%; cursor: crosshair; touch-action: none; }
      #sel {
        position: absolute;
        border: 1px solid #fff;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }
      #go {
        border-radius: 0.5rem;
        border-color: var(--accent);
        background: var(--accent);
        font-weight: 600;
        padding: 0.5rem 1.1rem;
      }
      #go:disabled { opacity: 0.5; cursor: default; }

      #bar { height: 3px; margin-top: 1.25rem; background: var(--line); border-radius: 999px; overflow: hidden; }
      #bar div { height: 100%; width: 0; background: var(--accent); transition: width 0.1s linear; }
      #status { margin-top: 0.75rem; font-size: 0.875rem; color: var(--dim); min-height: 1.5em; }
      #status.bad { color: var(--bad); }

      #out { margin-top: 1.25rem; padding: 1rem; border: 1px solid var(--line); border-radius: 0.75rem; background: var(--panel); }
      #out img {
        display: block;
        max-width: 100%;
        margin: 0 auto 0.875rem;
        border-radius: 0.375rem;
        background: repeating-conic-gradient(#2c2d31 0% 25%, #232428 0% 50%) 50% / 16px 16px;
      }
      .meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem; font-size: 0.875rem; }
      .ok { color: var(--ok); }
      .warn { color: var(--warn); }
      #dl {
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      footer { margin-top: 2.5rem; color: var(--dim); font-size: 0.8125rem; }
      footer a { color: var(--dim); }
    </style>
  </head>
  <body>
    <h1>gif it</h1>
    <p class="sub">Image or video → GIF, sized for Discord. Runs entirely in your browser — nothing is uploaded.</p>

    <div id="drop" tabindex="0" role="button" aria-label="Choose a file to convert">
      <strong>Drop a file</strong>
      <small>or click to browse · or paste · png jpg webp mp4 webm mov</small>
    </div>
    <input id="file" type="file" accept="image/png,image/jpeg,image/webp,video/*" />

    <div id="crop" hidden>
      <div id="stage"><canvas id="src"></canvas><div id="sel" hidden></div></div>
      <p class="sub">Drag to crop · click to clear</p>
    </div>

    <fieldset id="controls" hidden>
      <div class="chips" id="presets"></div>

      <div class="row">
        <label title="Longest edge, in pixels">size <input id="size" type="number" min="1" max="2048" step="1" /></label>
        <label id="fpsRow">fps <input id="fps" type="number" min="1" max="50" step="1" value="15" /></label>
        <label><input id="dither" type="checkbox" checked /> dither</label>
        <button id="go" type="button">Convert</button>
      </div>
    </fieldset>

    <div id="bar" hidden><div></div></div>
    <p id="status"></p>

    <div id="out" hidden>
      <img id="preview" alt="Converted GIF preview" />
      <div class="meta">
        <span id="info"></span>
        <a id="dl" download>Download</a>
      </div>
    </div>

    <footer>
      No server, no upload. <a href="https://github.com/mattdesl/gifenc">gifenc</a> does the encoding.
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
